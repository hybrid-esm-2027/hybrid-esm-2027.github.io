# Planned meeting outputs (proposal v0.5, p. 1–2).
- title: Community white paper outline
  detail: An outline for a community white paper on hybrid ML-physics climate modeling and climate emulation, with named drafting leads.
- title: Benchmark and diagnostics specification
  detail: For online coupled hybrid models and emulators — conservation, drift, feedbacks, climate sensitivity, internal variability, extremes, and out-of-distribution forcing.
- title: Coupling interface checklist
  detail: For atmosphere, ocean, sea ice, land, chemistry, radiation, and coupler time-stepping.
- title: Lower-order and idealized test-case ladder
  detail: Spanning toy systems, single-column models, aquaplanets, slab oceans, AMIP-style tests, and coupled prototypes.
- title: Coupled model intercomparison pilot plan
  detail: Covering 3–5 candidate systems for coupled emulation and coupled runs, with 6–12 month milestones.
- title: Shared failure-mode catalog
  detail: For emulator coupling, including unstable rollouts, muted variability, energy leaks, nonphysical feedbacks, and regime-locking.

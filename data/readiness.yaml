# Readiness scale (proposal v0.5, §1.1). Contributors self-assess against this scale.
- level: R0
  status: Conceptual or offline prototype
  evidence: Clear target process or component, training data identified, offline diagnostics started, known physical constraints stated.
- level: R1
  status: Offline replay or tendency testing
  evidence: Skill against held-out simulations, physical-range checks, conservation tendencies, variable and unit conventions, sensitivity to input distribution.
- level: R2
  status: Online component in prescribed-boundary mode
  evidence: Stable multi-year rollout with prescribed boundary conditions, seasonal cycle, spectra, process budgets, restart tests, and documented failure modes.
- level: R3
  status: Idealized or reduced coupled setting
  evidence: Demonstrated behavior in lower-order models, SCM/RCE, aquaplanet, slab-ocean, shallow-water/QG, or other controlled coupled tests.
- level: R4
  status: Limited coupled prototype
  evidence: Interactive coupling with budget monitoring, drift analysis, response to forcing perturbations, variability diagnostics, and sensitivity to coupling frequency.
- level: R5
  status: Intercomparison candidate
  evidence: Reproducible configuration, documented training data, standard diagnostics, restart files, model card, compute-cost estimate, and willingness to run shared benchmark experiments.
- level: R6
  status: Multi-decadal / centennial coupled response
  evidence: Stable 100+ year rollouts, conservation closure, unforced natural variability (ENSO, AMOC, and MJO power spectra), and forced-response verification (4×CO<sub>2</sub> or 1% CO<sub>2</sub> yr<sup>−1</sup> sensitivity).
